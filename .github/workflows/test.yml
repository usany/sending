name: Test localhost

on:
  push:
    branches: [ main, bravo ]
  pull_request:
    branches: [ main, bravo ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CFAPITOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CFACCOUNTID }}
      USER: ${{ secrets.USER }}
      ACCESSTOKEN: ${{ secrets.ACCESSTOKEN }}
      CLIENTID: ${{ secrets.CLIENTID }}
      CLIENTSECRET: ${{ secrets.CLIENTSECRET }}
      REFRESHTOKEN: ${{ secrets.REFRESHTOKEN }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
      
      - name: Start local dev server
        run: |
          echo "CLOUDFLARE_API_TOKEN=${{ env.CLOUDFLARE_API_TOKEN }}" >> .dev.vars
          echo "CLOUDFLARE_ACCOUNT_ID=${{ env.CLOUDFLARE_ACCOUNT_ID }}" >> .dev.vars
          echo "USER=${{ env.USER }}" >> .dev.vars
          echo "ACCESSTOKEN=${{ env.ACCESSTOKEN }}" >> .dev.vars
          echo "CLIENTID=${{ env.CLIENTID }}" >> .dev.vars
          echo "CLIENTSECRET=${{ env.CLIENTSECRET }}" >> .dev.vars
          echo "REFRESHTOKEN=${{ env.REFRESHTOKEN }}" >> .dev.vars
          pnpm remote &
          echo "Starting local dev server..."
          sleep 15
      
      - name: Wait for local dev server to be ready
        run: |
          echo "Waiting for local dev server to be ready..."
          for i in {1..15}; do
            if curl -s http://localhost:8787 > /dev/null 2>&1; then
              echo "Local dev server is ready!"
              break
            fi
            echo "Attempt $i: Local dev server not ready yet..."
            sleep 3
          done
      
      - name: Run tests against local dev server
        run: pnpm test
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f "wrangler dev" || true
