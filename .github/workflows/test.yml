name: Test localhost

on:
  push:
    branches: [ main, bravo ]
  pull_request:
    branches: [ main, bravo ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
      
      - name: Authenticate with Cloudflare
        run: |
          wrangler auth --api-token "${{ secrets.CFAPITOKEN }}"
      
      - name: Start remote dev server
        run: |
          pnpm remote &
          echo "Starting remote dev server..."
          sleep 10
      
      - name: Wait for remote dev server to be ready
        run: |
          echo "Waiting for remote dev server to be ready..."
          for i in {1..15}; do
            if curl -s http://localhost:8787 > /dev/null 2>&1; then
              echo "Remote dev server is ready!"
              break
            fi
            echo "Attempt $i: Remote dev server not ready yet..."
            sleep 3
          done
      
      - name: Run tests against remote dev server
        run: pnpm test
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f "wrangler dev" || true
