name: Test localhost

on:
  push:
    branches: [ main, bravo ]
  pull_request:
    branches: [ main, bravo ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install
      
      - name: Build & Deploy Worker
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CFAPITOKEN }}
          accountId: ${{ secrets.CFACCOUNTID }}
          command: deploy
      
      - name: Get deployed worker URL
        id: worker_url
        run: |
          WORKER_URL="https://express-d1-app.${{ secrets.CFACCOUNTID }}.workers.dev"
          echo "url=$WORKER_URL" >> $GITHUB_OUTPUT
          echo "Deployed worker URL: $WORKER_URL"
      
      - name: Wait for deployment to be ready
        run: |
          echo "Waiting for deployment to be ready..."
          for i in {1..10}; do
            if curl -s ${{ steps.worker_url.outputs.url }} > /dev/null 2>&1; then
              echo "Deployment is ready!"
              break
            fi
            echo "Attempt $i: Deployment not ready yet..."
            sleep 5
          done
      
      - name: Run tests against deployed worker
        run: pnpm test
        env:
          WORKER_URL: ${{ steps.worker_url.outputs.url }}
      
      - name: Cleanup
        if: always()
        run: |
          pkill -f "wrangler dev" || true
